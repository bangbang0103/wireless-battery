schema_version: 1
id: synthetic.feature.mouse
version: 1.0.0
status: experimental
name: Synthetic Feature Mouse
source: synthetic
match:
  all:
    vid: 0x1234
    pid: 0x5678
    usage_page: 0xFF00
capabilities:
  percentage: true
  discrete_level: false
  voltage: false
  charge_state: true
  reachability: false
transport:
  kind: hid_feature
  timeout_ms: 200
  cooldown_ms: 0
query:
  steps:
    - id: battery
      send_feature:
        report_id: 0x09
        payload_hex: "01 00 00 00"
      receive_feature:
        report_id: 0x09
        length: 4
response:
  length: 4
  report_id: 0x09
  constants:
    - offset: 0
      hex: "01"
  checksum:
    algorithm: sum8
    range: [0, 2]
    offset: 3
fields:
  percentage:
    offset: 1
    type: u8
    valid_range: [0, 100]
    unknown_values: [255]
  charge_state:
    offset: 2
    type: bool_bit
    bit: 0
    map:
      "true": charging
      "false": discharging
evidence:
  fixtures:
    - fixtures/synthetic/feature_normal.json
    - fixtures/synthetic/feature_truncated.json
    - fixtures/synthetic/feature_unknown.json
  provenance: provenance/synthetic.feature.mouse.md
  capability_status:
    percentage: experimental
    charge_state: experimental
    full: unverified
    sleeping: unverified
