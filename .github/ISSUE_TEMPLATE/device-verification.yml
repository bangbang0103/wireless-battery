name: Device verification
description: Record real-hardware capability verification
title: "[Verify]: <device and capability>"
labels: [verification]
body:
  - type: input
    id: device
    attributes:
      label: Package and device model
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, connection, firmware if known, library version/commit. No serial number or raw path.
    validations:
      required: true
  - type: checkboxes
    id: capabilities
    attributes:
      label: Verified capabilities
      options:
        - label: Percentage
        - label: Charging and not charging
        - label: Full
        - label: Low battery
        - label: Sleeping/offline
        - label: Disconnect and reconnect
  - type: textarea
    id: fixtures
    attributes:
      label: Fixture references and observations
      description: Link sanitized fixtures and describe any unverified states explicitly.
    validations:
      required: true
