name: New device
description: Request or propose a peripheral battery protocol
title: "[Device]: <vendor and model>"
labels: [device]
body:
  - type: input
    id: identity
    attributes:
      label: Device identity
      description: Brand, model, connection mode (2.4G / wired / BLE), `wireless-battery list --json` endpoint metadata (VID/PID, usage_page, usage, interface_number), receiver and firmware if known. Do not include serial numbers or raw system paths.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Battery behavior
      description: Percentage or levels, charging/full states, connection type, and manufacturer software behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Available evidence
      description: Paired request/response `probe` hex for discharging & charging states (verified with the vendor software closed) plus ground-truth percentage/state, or protocol documentation, sanitized fixtures, and source licenses. No PCAP files or raw system paths.
  - type: checkboxes
    id: permission
    attributes:
      label: Contribution safety
      options:
        - label: I have removed serial numbers, usernames, paths, keystrokes, and unrelated traffic.
          required: true
        - label: I will not claim verified support without real-hardware evidence.
          required: true
