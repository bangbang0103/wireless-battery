name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cargo and Info.plist versions match tag
        shell: bash
        run: |
          root_ver="$(awk -F'"' '/^version *= *"/{print $2; exit}' Cargo.toml)"
          tray_ver="$(awk -F'"' '/^version *= *"/{print $2; exit}' tray/Cargo.toml)"
          plist_ver="$(awk '/<key>CFBundleShortVersionString<\/key>/{getline; gsub(/.*<string>|<\/string>.*/, "", $0); gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0); print; exit}' tray/platforms/macos/Resources/Info.plist)"
          echo "root=$root_ver tray=$tray_ver plist=$plist_ver ref=${GITHUB_REF_NAME}"
          if [[ "${root_ver}" != "${tray_ver}" ]] || [[ "${root_ver}" != "${plist_ver}" ]]; then
            echo "error: version mismatch between Cargo.toml, tray/Cargo.toml, and Info.plist" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_ver="${GITHUB_REF_NAME#v}"
            if [[ "${root_ver}" != "${tag_ver}" ]]; then
              echo "error: release tag (${tag_ver}) does not match crate/plist version (${root_ver})" >&2
              exit 1
            fi
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.76.0
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-1.76-${{ hashFiles('Cargo.lock') }}
      - name: Cache Tray Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tray/target
          key: ${{ runner.os }}-release-tray-cargo-1.76-${{ hashFiles('tray/Cargo.lock') }}
      - name: Build CLI release
        run: cargo build --locked --release --bin wireless-battery
      - name: Build Windows tray release
        if: runner.os == 'Windows'
        working-directory: tray
        run: cargo build --locked --release -p wireless-battery-tray
      - name: Package Windows portable archives and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, dist\portable-stage | Out-Null
          Compress-Archive -Path target/release/wireless-battery.exe, LICENSE, NOTICE -DestinationPath dist/wireless-battery-cli-windows.zip -Force
          Copy-Item tray/target/release/wireless-battery-tray.exe, target/release/wireless-battery.exe, LICENSE, NOTICE -Destination dist/portable-stage
          Set-Content -Path dist/portable-stage/portable.txt -Value "Remove this file to store tray.json in %APPDATA% instead of the application folder."
          Compress-Archive -Path dist/portable-stage/* -DestinationPath dist/wireless-battery-portable-windows-x64.zip -Force
          Remove-Item -Recurse -Force dist/portable-stage

          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $defaultIscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (Test-Path $defaultIscc) {
              $iscc = $defaultIscc
            } else {
              choco install innosetup -y --no-progress
              $iscc = $defaultIscc
            }
          }
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.1.0" }
          & $iscc "/DAppVersion=$version" tray/platforms/windows/installer/wireless-battery.iss
      - name: Build macOS tray bundle and DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash tray/platforms/macos/scripts/bundle-app.sh
          bash tray/platforms/macos/scripts/package-dmg.sh dist/wireless-battery-macos.dmg
      - name: Package macOS release archives
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf dist/wireless-battery-cli-macos.tar.gz -C target/release wireless-battery -C "${GITHUB_WORKSPACE}" LICENSE NOTICE
          ditto -c -k --sequesterRsrc --keepParent "tray/platforms/macos/dist/Wireless Battery.app" dist/wireless-battery-tray-macos.zip
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (gh release view $tag 2>$null) {
            gh release upload $tag dist/* --clobber
          } else {
            gh release create $tag dist/* --title $tag --generate-notes
          }
