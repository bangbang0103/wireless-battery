name: CI

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux HID/BlueZ build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libusb-1.0-0-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.76.0
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.76-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --no-default-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features --lib
      - name: Check synthetic devices stay out of real support
        shell: bash
        run: |
          ! grep -R 'synthetic\.' docs/support-matrix.md docs/support-matrix.zh-CN.md
      - name: Build CLI release
        run: cargo build --locked --release --bin wireless-battery
      - name: Upload Linux CLI artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wireless-battery-cli-linux
          path: target/release/wireless-battery
      - name: Upload Windows CLI artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: wireless-battery-cli-windows
          path: target/release/wireless-battery.exe
      - name: Upload macOS CLI artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: wireless-battery-cli-macos
          path: target/release/wireless-battery

  tray:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux HID/BlueZ build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libusb-1.0-0-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.76.0
          components: rustfmt, clippy
      - name: Cache Tray Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tray/target
          key: ${{ runner.os }}-tray-cargo-1.76-${{ hashFiles('tray/Cargo.lock') }}
      - working-directory: tray
        run: cargo fmt --all -- --check
      - working-directory: tray
        run: cargo clippy --locked --all-targets --all-features -p wireless-battery-tray-core -p wireless-battery-tray-ffi -- -D warnings
      - working-directory: tray
        run: cargo clippy --locked --no-default-features -p wireless-battery-tray-core -p wireless-battery-tray-ffi -- -D warnings
      - working-directory: tray
        run: cargo test --locked --all-features -p wireless-battery-tray-core -p wireless-battery-tray-ffi
      - working-directory: tray
        run: cargo test --locked --no-default-features -p wireless-battery-tray-core -p wireless-battery-tray-ffi
      - name: Verify --no-default-features excludes BLE runtime dependencies (FFI & core)
        working-directory: tray
        shell: bash
        run: |
          ! cargo tree --locked --no-default-features -p wireless-battery-tray-ffi | grep -Eq '\b(btleplug|tokio)\b'
      - name: Check Windows native tray (--all-features & --no-default-features)
        if: runner.os == 'Windows'
        working-directory: tray
        shell: bash
        run: |
          cargo clippy --locked --all-targets --all-features -p wireless-battery-tray -- -D warnings
          cargo clippy --locked --no-default-features -p wireless-battery-tray -- -D warnings
          cargo test --locked --all-features -p wireless-battery-tray
          ! cargo tree --locked --no-default-features -p wireless-battery-tray | grep -Eq '\b(btleplug|tokio)\b'
      - name: Build Windows native tray release
        if: runner.os == 'Windows'
        working-directory: tray
        run: cargo build --locked --release -p wireless-battery-tray
      - name: Upload Windows tray artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: wireless-battery-tray-windows
          path: tray/target/release/wireless-battery-tray.exe
      - name: Build macOS native SwiftUI tray bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash tray/platforms/macos/scripts/bundle-app.sh
          ditto -c -k --sequesterRsrc --keepParent "tray/platforms/macos/dist/Wireless Battery.app" "tray/platforms/macos/dist/wireless-battery-tray-macos.zip"
      - name: Upload macOS tray artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: wireless-battery-tray-macos
          path: tray/platforms/macos/dist/wireless-battery-tray-macos.zip
