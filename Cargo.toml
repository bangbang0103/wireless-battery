[package]
name = "wireless-battery"
version = "0.1.1"
edition = "2021"
rust-version = "1.76"
description = "Conservative, replayable peripheral battery readings"
license = "GPL-3.0-or-later"
keywords = ["hid", "battery", "bluetooth", "peripherals"]
categories = ["hardware-support"]

[lib]
name = "wireless_battery"
path = "src/lib.rs"

[[bin]]
name = "wireless-battery"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "bluetooth"]
cli = ["dep:clap"]
bluetooth = ["dep:btleplug", "dep:tokio", "dep:uuid"]

[dependencies]
btleplug = { version = "0.11.7", optional = true }
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5.4", features = ["derive"], optional = true }
hex = "0.4.3"
hidapi = "2.6.3"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.117"
sha2 = "0.10.8"
thiserror = "1.0.61"
tokio = { version = "1.42.0", features = ["rt", "time"], optional = true }
uuid = { version = "1.11.0", optional = true }

[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.0"
tempfile = "3.10.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
