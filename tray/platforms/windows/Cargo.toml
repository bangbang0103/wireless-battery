[package]
name = "wireless-battery-tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Windows system tray application for Wireless Battery (Win32 + DWM Acrylic + Direct2D/DirectWrite)"

[[bin]]
name = "wireless-battery-tray"
path = "src/main.rs"

[features]
default = ["bluetooth"]
bluetooth = ["wireless-battery-tray-core/bluetooth"]
dev-tools = ["wireless-battery-tray-core/dev-tools"]

[dependencies]
chrono = { version = "0.4.38", features = ["serde"] }
wireless-battery = { path = "../../..", default-features = false }
wireless-battery-tray-core = { path = "../../crates/tray-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.57.0", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.clippy]
all = "deny"
