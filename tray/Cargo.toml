[workspace]
resolver = "2"
members = [
    "crates/tray-core",
    "crates/tray-ffi",
    "platforms/windows",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.76"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
